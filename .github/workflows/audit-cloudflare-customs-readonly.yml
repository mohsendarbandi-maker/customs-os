name: Read-only Cloudflare customs Worker audit

on:
  push:
    branches:
      - rebuild/cloudflare-free-first
    paths:
      - ".github/workflows/audit-cloudflare-customs-readonly.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    environment:
      name: Preview – customs-os
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only Cloudflare Worker and frontend audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Preview Cloudflare credentials are unavailable.');
          const api = async (path) => {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
              cache: 'no-store',
              signal: AbortSignal.timeout(15000),
            });
            let body = null;
            try { body = await response.json(); } catch {}
            return { status: response.status, success: response.ok && body?.success === true, body };
          };
          const tokenVerification = await api('/user/tokens/verify');
          const tokenPolicies = tokenVerification.body?.result?.policies ?? [];
          const tokenPermissionNames = [...new Set(tokenPolicies.flatMap((policy) =>
            (policy.permission_groups ?? []).map((group) => group.name).filter(Boolean)
          ))].sort();
          const [settings, deployments, versions, domains] = await Promise.all([
            api('/accounts/' + accountId + '/workers/scripts/customs/settings'),
            api('/accounts/' + accountId + '/workers/scripts/customs/deployments'),
            api('/accounts/' + accountId + '/workers/scripts/customs/versions?per_page=10'),
            api('/accounts/' + accountId + '/workers/domains'),
          ]);
          const stagingD1 = await api('/accounts/' + accountId + '/d1/database/b938fa3c-4995-4d27-aeda-f72f2d484a3c?fields=uuid,name,created_at,jurisdiction,version');
          const asList = (payload) => {
            const value = payload?.result;
            if (Array.isArray(value)) return value;
            if (value && typeof value === 'object') {
              for (const candidate of Object.values(value)) if (Array.isArray(candidate)) return candidate;
            }
            return [];
          };
          const deploymentItems = asList(deployments.body);
          const versionItems = asList(versions.body);
          const activeVersionIds = [...new Set(deploymentItems.flatMap((deployment) =>
            (deployment.versions ?? []).filter((version) => Number(version.percentage ?? 0) > 0).map((version) => version.version_id)
          ))];
          const activeVersions = activeVersionIds.slice(0, 5).map((id) => ({ id }));
          const activeVersionDetails = await Promise.all(activeVersionIds.slice(0, 3).map(async (id) => {
            const response = await api('/accounts/' + accountId + '/workers/scripts/customs/versions/' + encodeURIComponent(id));
            const version = response.body?.result ?? {};
            const resources = version.resources ?? {};
            return {
              id: version.id ?? id,
              number: version.number ?? null,
              metadata: version.metadata ?? null,
              script: resources.script ? {
                etag: resources.script.etag ?? null,
                handlers: resources.script.handlers ?? [],
                lastDeployedFrom: resources.script.last_deployed_from ?? null,
              } : null,
              bindings: Array.isArray(resources.bindings)
                ? resources.bindings.map((binding) => ({ name: binding.name, type: binding.type }))
                : resources.bindings ?? null,
              resourceKeys: Object.keys(resources),
              success: response.success,
              httpStatus: response.status,
            };
          }));
          const latestUploadedVersionId = versionItems[0]?.id ?? null;
          const latestUploadedVersionDetails = latestUploadedVersionId
            ? await api('/accounts/' + accountId + '/workers/scripts/customs/versions/' + encodeURIComponent(latestUploadedVersionId))
            : { status: 0, success: false, body: null };
          const latestUploadedVersion = latestUploadedVersionDetails.body?.result ?? {};
          const latestUploadedResources = latestUploadedVersion.resources ?? {};
          const latestUploadedVersionAudit = {
            httpStatus: latestUploadedVersionDetails.status,
            success: latestUploadedVersionDetails.success,
            id: latestUploadedVersion.id ?? latestUploadedVersionId,
            number: latestUploadedVersion.number ?? null,
            createdOn: latestUploadedVersion.metadata?.created_on ?? null,
            source: latestUploadedVersion.metadata?.source ?? null,
            scriptEtag: latestUploadedResources.script?.etag ?? null,
            bindings: Array.isArray(latestUploadedResources.bindings)
              ? latestUploadedResources.bindings.map((binding) => ({ name: binding.name, type: binding.type }))
              : latestUploadedResources.bindings ?? null,
            compatibilityDate: latestUploadedResources.script_runtime?.compatibility_date ?? null,
            usageModel: latestUploadedResources.script_runtime?.usage_model ?? null,
          };
          const activeVersionId = activeVersionIds[0] ?? null;
          const activeVersion = activeVersionId
            ? await api('/accounts/' + accountId + '/workers/scripts/customs/versions/' + encodeURIComponent(activeVersionId))
            : { status: 0, success: false, body: null };
          const activeVersionText = JSON.stringify(activeVersion.body?.result ?? {});
          const scriptResponse = await fetch('https://api.cloudflare.com/client/v4/accounts/' + accountId + '/workers/scripts/customs', {
            headers: { Authorization: 'Bearer ' + token, Accept: '*/*' },
            cache: 'no-store',
            signal: AbortSignal.timeout(20000),
          });
          const scriptSource = await scriptResponse.text();
          const latestVersionId = versionItems[0]?.id ?? null;
          const latestVersion = latestVersionId
            ? await api('/accounts/' + accountId + '/workers/scripts/customs/versions/' + encodeURIComponent(latestVersionId))
            : { status: 0, success: false, body: null };
          const activeVersionResource = activeVersion.body?.result?.resources ?? {};
          const latestVersionResource = latestVersion.body?.result?.resources ?? {};
          const versionContentAudit = {
            activeVersion: {
              id: activeVersionId,
              number: activeVersion.body?.result?.number ?? null,
              createdOn: activeVersion.body?.result?.metadata?.created_on ?? null,
              scriptEtag: activeVersionResource.script?.etag ?? null,
              bindings: Array.isArray(activeVersionResource.bindings)
                ? activeVersionResource.bindings.map((binding) => ({ name: binding.name, type: binding.type }))
                : Object.keys(activeVersionResource.bindings ?? {}),
            },
            latestUploadedVersion: {
              id: latestVersionId,
              number: latestVersion.body?.result?.number ?? null,
              createdOn: latestVersion.body?.result?.metadata?.created_on ?? null,
              source: latestVersion.body?.result?.metadata?.source ?? null,
              scriptEtag: latestVersionResource.script?.etag ?? null,
              bindings: Array.isArray(latestVersionResource.bindings)
                ? latestVersionResource.bindings.map((binding) => ({ name: binding.name, type: binding.type }))
                : Object.keys(latestVersionResource.bindings ?? {}),
            },
            downloadedScriptEtag: scriptResponse.headers.get('etag'),
            activeMatchesLatestScript: Boolean(activeVersionResource.script?.etag) &&
              activeVersionResource.script.etag === (scriptResponse.headers.get('etag') ?? latestVersionResource.script?.etag),
            latestVersionHasPreview: latestVersion.body?.result?.metadata?.has_preview ?? null,
          };
          const candidateVersionIds = [
            activeVersionId,
            versionItems[0]?.id ?? null,
          ].filter((value, index, all) => value && all.indexOf(value) === index);
          const versionUrlChecks = await Promise.all(candidateVersionIds.map(async (id) => {
            const versionUrl = 'https://' + id.slice(0, 8) + '-customs.mohsen-darbandi.workers.dev/';
            try {
              const response = await fetch(versionUrl, {
                headers: { Accept: 'text/html' },
                cache: 'no-store',
                signal: AbortSignal.timeout(15000),
              });
              const html = await response.text();
              return {
                versionId: id,
                url: versionUrl,
                status: response.status,
                finalUrl: response.url,
                titleFound: html.includes('<title'),
                hasMobileHostCodeInHtml: html.includes('mobile.darbandicommercial.ir'),
                bytes: new TextEncoder().encode(html).length,
              };
            } catch (error) {
              return { versionId: id, url: versionUrl, error: error instanceof Error ? error.message : 'request failed' };
            }
          }));
          const activeVersionAudit = {
            httpStatus: activeVersion.status,
            success: activeVersion.success,
            versionId: activeVersionId,
            resultKeys: Object.keys(activeVersion.body?.result ?? {}),
            resourcesShape: Array.isArray(activeVersion.body?.result?.resources)
              ? 'array'
              : typeof activeVersion.body?.result?.resources,
            activeVersionHasMobileHostReference: activeVersionText.includes('mobile.darbandicommercial.ir'),
            activeVersionHasAssetBaseRewrite: activeVersionText.includes('assetBase.hostname'),
            activeVersionHasBuildSignature: activeVersionText.includes('20261107-ocean-adaptive-mobile-v5'),
            scriptSourceHttpStatus: scriptResponse.status,
            scriptSourceBytes: new TextEncoder().encode(scriptSource).length,
            uploadedSourceHasMobileHostReference: scriptSource.includes('mobile.darbandicommercial.ir'),
            uploadedSourceHasAssetBaseRewrite: scriptSource.includes('assetBase.hostname'),
            uploadedSourceHasBuildSignature: scriptSource.includes('20261107-ocean-adaptive-mobile-v5'),
          };
          const smokeHosts = [
            'https://chat.darbandicommercial.ir',
            'https://reminders.darbandicommercial.ir',
            'https://darbandicommercial.ir',
            'https://mobile.darbandicommercial.ir',
          ];
          const frontendChecks = await Promise.all(smokeHosts.map(async (base) => {
            try {
              const page = await fetch(base + '/', {
                headers: { Accept: 'text/html' }, cache: 'no-store', signal: AbortSignal.timeout(20000),
              });
              const html = await page.text();
              const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js)["']/gi)].map((match) => match[1]).slice(0, 3);
              const styles = [...html.matchAll(/<link[^>]+href=["']([^"']+\.css)["']/gi)].map((match) => match[1]).slice(0, 3);
              const assets = await Promise.all([...scripts, ...styles].map(async (assetPath) => {
                try {
                  const url = new URL(assetPath, base);
                  const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
                  const bytes = (await response.arrayBuffer()).byteLength;
                  return { path: url.pathname, status: response.status, contentType: response.headers.get('content-type'), bytes };
                } catch (error) {
                  return { path: assetPath, error: error instanceof Error ? error.message : 'request failed' };
                }
              }));
              return {
                host: base, status: page.status, contentType: page.headers.get('content-type'),
                buildSignature: page.headers.get('x-customs-os-build'),
                finalUrl: page.url,
                pageTitle: (() => { const a = html.toLowerCase().indexOf('<title'); const b = a < 0 ? -1 : html.indexOf('>', a); const c = b < 0 ? -1 : html.toLowerCase().indexOf('</title>', b); return b < 0 || c < 0 ? '' : html.slice(b + 1, c).replaceAll('\n', ' ').replaceAll('\r', ' ').trim().slice(0, 160); })(),
                htmlBytes: new TextEncoder().encode(html).length,
                scriptPaths: scripts, stylePaths: styles, assets,
                frontendAssetsOk: page.ok && scripts.length > 0 && assets.length > 0 &&
                  assets.every((asset) => asset.status === 200 && asset.bytes > 0),
              };
            } catch (error) {
              return { host: base, error: error instanceof Error ? error.message : 'request failed' };
            }
          }));
          let stagingSchemaAudit = { checked: false, error: 'not_requested' };
          try {
            const response = await fetch('https://customs-os-migration-staging.mohsen-darbandi.workers.dev/migration/schema', {
              headers: { Accept: 'application/json' },
              cache: 'no-store',
              signal: AbortSignal.timeout(20000),
            });
            const payload = await response.json();
            const tables = Array.isArray(payload.tables) ? payload.tables : [];
            const relevant = new Set([
              'vessels',
              'profiles',
              'customs_admin_sessions',
              'customs_admin_credentials',
              'customs_admin_login_attempts',
              'customs_os_auth_events',
              'customs_os_import_table_status',
              'customs_os_organization_imports',
            ]);
            stagingSchemaAudit = {
              checked: true,
              status: response.status,
              ok: response.ok && payload.ok === true,
              tableCount: payload.tableCount ?? tables.length,
              totalRows: payload.totalRows ?? null,
              countFailures: payload.countFailures ?? null,
              authRelatedTables: tables
                .filter((table) => relevant.has(String(table.name || '')) || /auth|user|profile|session|credential|login/i.test(String(table.name || '')))
                .map((table) => ({
                  name: table.name,
                  rowCount: table.rowCount ?? null,
                  countVerified: table.countVerified === true,
                  schemaSql: relevant.has(table.name) ? table.schemaSql : undefined,
                })),
            };
          } catch (error) {
            stagingSchemaAudit = {
              checked: true,
              ok: false,
              error: error instanceof Error ? error.message : 'staging schema probe failed',
            };
          }
          const rootHtml = frontendChecks.find((item) => item.host === 'https://darbandicommercial.ir');
          const appScriptPath = rootHtml?.scriptPaths?.find((path) => path.startsWith('/assets/') && path.endsWith('.js'));
          let authRuntime = { scriptPath: appScriptPath ?? null, checked: false };
          if (appScriptPath) {
            try {
              const response = await fetch('https://darbandicommercial.ir' + appScriptPath, {
                cache: 'no-store',
                signal: AbortSignal.timeout(20000),
              });
              const script = await response.text();
              authRuntime = {
                scriptPath: appScriptPath,
                status: response.status,
                bytes: new TextEncoder().encode(script).length,
                checked: response.ok,
                usesCloudflareSessionEndpoint: script.includes('/api/auth/session'),
                usesCloudflareLoginEndpoint: script.includes('/api/auth/login'),
                containsSupabasePasswordGrant: script.includes('grant_type=password') || script.includes('signInWithPassword'),
                containsSupabaseAuthApiPath: script.includes('/auth/v1/token'),
              };
            } catch (error) {
              authRuntime = {
                scriptPath: appScriptPath,
                checked: false,
                error: error instanceof Error ? error.message : 'script probe failed',
              };
            }
          }
          let authSessionEndpoint = null;
          try {
            const response = await fetch('https://darbandicommercial.ir/api/auth/session', {
              headers: { Accept: 'application/json' },
              cache: 'no-store',
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.text();
            authSessionEndpoint = {
              status: response.status,
              contentType: response.headers.get('content-type'),
              bodyPrefix: body.slice(0, 180),
            };
          } catch (error) {
            authSessionEndpoint = { error: error instanceof Error ? error.message : 'session endpoint probe failed' };
          }
          const result = {
            credentials: { cloudflareApiTokenPresent: Boolean(token), accountIdPresent: Boolean(accountId) },
            cloudflareTokenPermissions: {
              httpStatus: tokenVerification.status,
              success: tokenVerification.success,
              permissionGroupNames: tokenPermissionNames,
              d1WritePermissionPresent: tokenPermissionNames.some((name) => /D1.*(?:Edit|Write)|(?:Edit|Write).*D1/i.test(name)),
              workersScriptsEditPresent: tokenPermissionNames.some((name) => /Workers Scripts.*Edit/i.test(name)),
            },
            stagingD1ReadPermissionProbe: {
              httpStatus: stagingD1.status,
              success: stagingD1.success,
              database: stagingD1.body?.result ? {
                uuid: stagingD1.body.result.uuid,
                name: stagingD1.body.result.name,
                jurisdiction: stagingD1.body.result.jurisdiction,
                version: stagingD1.body.result.version,
              } : null,
              errorCodes: (stagingD1.body?.errors ?? []).map((item) => item.code),
            },
            customsSettings: {
              httpStatus: settings.status, success: settings.success,
              bindings: (settings.body?.result?.bindings ?? []).map((binding) => ({ name: binding.name, type: binding.type, bucket_name: binding.bucket_name ?? undefined })),
              compatibilityDate: settings.body?.result?.compatibility_date ?? null,
              usageModel: settings.body?.result?.usage_model ?? null,
              lastDeployedVersionId: settings.body?.result?.last_deployed_version_id ?? null,
            workersDev: settings.body?.result?.workers_dev ?? null,
            previewUrls: settings.body?.result?.preview_urls ?? null,
            },
            deployments: {
              httpStatus: deployments.status, success: deployments.success,
              count: deploymentItems.length,
              responseKeys: Object.keys(deployments.body?.result ?? {}),
              latest: deploymentItems.slice(0, 5).map((item) => ({
                id: item.id, createdOn: item.created_on, strategy: item.strategy,
                versions: (item.versions ?? []).map((v) => ({ versionId: v.version_id, percentage: v.percentage })),
              })),
            },
            activeVersions,
            activeVersionDetails,
            activeVersionAudit,
            latestUploadedVersionAudit,
            versionContentAudit,
            versionUrlChecks,
            recentVersions: {
              httpStatus: versions.status, success: versions.success,
              items: versionItems.slice(0, 5).map((item) => ({
                id: item.id, number: item.number, createdOn: item.metadata?.created_on, source: item.metadata?.source,
              })),
            },
            domains: {
              httpStatus: domains.status, success: domains.success,
              items: asList(domains.body).filter((item) =>
                ['darbandicommercial.ir','mobile.darbandicommercial.ir','chat.darbandicommercial.ir','reminders.darbandicommercial.ir'].includes(item.hostname)
              ).map((item) => ({ hostname: item.hostname, service: item.service, enabled: item.enabled })),
            },
            liveWorkerFrontends: frontendChecks,
            authRuntime,
            authSessionEndpoint,
            stagingSchemaAudit,
            stagingSelectedBusinessSchemas: stagingSchemaAudit.authRelatedTables?.filter((table) => table.name === 'vessels') ?? [],
          };
          console.log(JSON.stringify(result, null, 2));
          if (!settings.success || !deployments.success || !versions.success || !domains.success) {
            throw new Error('One or more read-only Cloudflare inventory requests failed.');
          }
          const requiredProductionHosts = [
            'darbandicommercial.ir',
            'mobile.darbandicommercial.ir',
            'chat.darbandicommercial.ir',
            'reminders.darbandicommercial.ir',
          ];
          const actualDomainMap = asList(domains.body);
          const wrongDomainBindings = requiredProductionHosts.filter((hostname) =>
            actualDomainMap.find((item) => item.hostname === hostname)?.service !== 'customs' ||
            actualDomainMap.find((item) => item.hostname === hostname)?.enabled !== true
          );
          if (wrongDomainBindings.length) {
            throw new Error('Production domain binding safety check failed: ' + wrongDomainBindings.join(', '));
          }
          const failedFrontendHosts = frontendChecks
            .filter((item) => !item.frontendAssetsOk)
            .map((item) => item.host);
          if (failedFrontendHosts.length) {
            throw new Error('Production frontend/asset smoke test failed: ' + failedFrontendHosts.join(', '));
          }
          if (
            authRuntime.checked !== true ||
            authRuntime.status !== 200 ||
            authRuntime.containsSupabasePasswordGrant !== true ||
            authRuntime.usesCloudflareLoginEndpoint === true ||
            authRuntime.usesCloudflareSessionEndpoint === true
          ) {
            throw new Error('Production Auth safety gate failed: the live bundle is not verified to use the current Supabase proxy login flow. Do not route Staging Auth to production.');
          }
          NODE

# Post-cutover verification trigger: confirm live mappings and frontend assets after domain reassignment.

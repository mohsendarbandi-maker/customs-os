name: Customs OS Priority Staging — Login and Shipments

on:
  push:
    branches:
      - rebuild/cloudflare-free-first
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.migration-staging.jsonc"
      - ".github/workflows/deploy-priority-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customs-os-priority-staging
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: Preview – customs-os
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CUSTOMS_ADMIN_PASSWORD: ${{ secrets.CUSTOMS_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert the isolated Staging target (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.migration-staging.jsonc', 'utf8'));
          const databases = config.d1_databases ?? [];
          const db = databases.find(item => item.binding === 'MIGRATION_DB');
          const checks = {
            worker: config.name === 'customs-os-migration-staging',
            workersDevOnly: config.workers_dev === true,
            noPreviewUrls: config.preview_urls === false,
            noCustomDomainRoutes: !Array.isArray(config.routes) || config.routes.length === 0,
            environment: config.vars?.MIGRATION_ENVIRONMENT === 'staging',
            productionImportDisabled: config.vars?.PRODUCTION_DATA_IMPORTED === 'false',
            assets: config.assets?.binding === 'ASSETS' && config.assets?.directory === './dist',
            singleD1: databases.length === 1 && db?.binding === 'MIGRATION_DB',
            databaseName: db?.database_name === 'customs-os-migration-staging',
            databaseId: String(db?.database_id ?? '').toLowerCase() === 'b938fa3c-4995-4d27-aeda-f72f2d484a3c',
            noPaidBindings: !config.r2_buckets && !config.kv_namespaces && !config.queues &&
              !config.ai && !config.vectorize && !config.services,
          };
          console.log(JSON.stringify({ worker: config.name, database: db?.database_name, checks }, null, 2));
          if (!Object.values(checks).every(Boolean)) {
            throw new Error('Refusing deployment: Staging isolation assertion failed.');
          }
          NODE
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Preview Cloudflare Worker deployment credentials are missing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production frontend build
        run: npm run build

      - name: Deploy Worker and static assets without applying D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 deploy --config wrangler.migration-staging.jsonc

      - name: Smoke-test public Staging health and unauthenticated protections
        shell: bash
        run: |
          set -euo pipefail
          base='https://customs-os-migration-staging.mohsen-darbandi.workers.dev'
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          health_code="$(curl --silent --show-error --max-time 30 --output "$work_dir/health.json" --write-out '%{http_code}' "$base/health")"
          test "$health_code" = "200"
          jq -e '.ok == true and .environment == "staging" and .productionTraffic == false and .productionDataImported == false' "$work_dir/health.json" >/dev/null

          db_code="$(curl --silent --show-error --max-time 30 --output "$work_dir/db.json" --write-out '%{http_code}' "$base/health/db")"
          test "$db_code" = "200"
          jq -e '.ok == true and .database == "customs-os-migration-staging" and .operationalImport.imported_records == 668' "$work_dir/db.json" >/dev/null 2>&1 ||             jq -e '.ok == true and .database == "customs-os-migration-staging" and .operationalImport.expected_records == 668' "$work_dir/db.json" >/dev/null

          session_code="$(curl --silent --show-error --max-time 20 --output "$work_dir/session.json" --write-out '%{http_code}' "$base/api/auth/session")"
          test "$session_code" = "200"
          jq -e '.authenticated == false' "$work_dir/session.json" >/dev/null

          shipment_code="$(curl --silent --show-error --max-time 20 --output "$work_dir/shipments.json" --write-out '%{http_code}' "$base/api/shipments")"
          test "$shipment_code" = "401"
          jq -e '.error == "UNAUTHORIZED"' "$work_dir/shipments.json" >/dev/null

          echo "Staging health passed; D1 binding is live; unauthenticated session and shipment reads are denied."

      - name: Verify admin session persistence and the 22 imported shipments (only when the Preview password secret is available)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CUSTOMS_ADMIN_PASSWORD:-}" ]; then
            echo "::warning::Live authenticated login, cookie persistence and shipment-count checks skipped: CUSTOMS_ADMIN_PASSWORD is not configured in the GitHub Preview environment. No credential was requested or printed."
            exit 0
          fi

          base='https://customs-os-migration-staging.mohsen-darbandi.workers.dev'
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          jq -n --arg password "$CUSTOMS_ADMIN_PASSWORD" \
            '{email:"admin@darbandicommercial.ir",password:$password}' > "$work_dir/login.json"
          login_code="$(curl --silent --show-error --max-time 25 --output "$work_dir/login-response.json" \
            --cookie-jar "$work_dir/cookies.txt" --write-out '%{http_code}' \
            --header "Origin: $base" --header 'Content-Type: application/json' \
            --data-binary @"$work_dir/login.json" "$base/api/auth/login")"
          rm -f "$work_dir/login.json"
          test "$login_code" = "200"
          jq -e '.authenticated == true and .profile.role == "owner"' "$work_dir/login-response.json" >/dev/null

          # A second, independent curl process reads the saved HttpOnly cookie jar,
          # approximating an app close/reopen without reading the cookie value.
          restore_code="$(curl --silent --show-error --max-time 20 --output "$work_dir/restored-session.json" \
            --cookie "$work_dir/cookies.txt" --write-out '%{http_code}' "$base/api/auth/session")"
          test "$restore_code" = "200"
          jq -e '.authenticated == true and .profile.organization_id == "ad95fdf1-e0e2-439b-92b0-c20ab07cacdd"' "$work_dir/restored-session.json" >/dev/null

          list_code="$(curl --silent --show-error --max-time 30 --output "$work_dir/shipments.json" \
            --cookie "$work_dir/cookies.txt" --write-out '%{http_code}' "$base/api/shipments?limit=200&offset=0")"
          test "$list_code" = "200"
          jq -e '.ok == true and .total == 22 and (.items | length) == 22' "$work_dir/shipments.json" >/dev/null

          echo "Admin login, persistent cookie restoration and the 22-row D1 shipment list passed. No shipment rows were created or modified by this smoke test."

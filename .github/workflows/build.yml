name: Customs OS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: customs-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production          # ← ADD THIS LINE
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Deploy Worker to Cloudflare
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test live Worker and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for base in "https://customs.mohsen-darbandi.workers.dev" "https://darbandicommercial.ir"; do
            echo "Checking $base/"
            curl --fail --silent --show-error --location --max-time 30 -o /tmp/index.html "$base/"
            grep -q '<div id="root"></div>' /tmp/index.html
            script_src="$(sed -n 's/.*<script[^>]*type="module"[^>]*src="\([^"]*\)".*/\1/p' /tmp/index.html | head -n 1)"
            test -n "$script_src"
            case "$script_src" in /*) ;; *) script_src="/$script_src";; esac
            echo "Checking $base$script_src"
            curl --fail --silent --show-error --location --max-time 30 -o /tmp/app.js "$base$script_src"
            test -s /tmp/app.js

            crm_src="$(grep -oE 'CRMPage-[A-Za-z0-9_-]+\\.js' /tmp/app.js | head -n 1)"
            test -n "$crm_src"
            echo "Checking $base/assets/$crm_src"
            curl --fail --silent --show-error --location --max-time 30 -o /tmp/crm.js "$base/assets/$crm_src"
            test -s /tmp/crm.js
          done
          echo "Live Worker smoke test passed."

name: Customs OS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: customs-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://bjngfgiecvihofemptub.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_pIh0yF6SQcQ-IAa_FkbjWA_qTSm83Sr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify Supabase client configuration was embedded
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F -q "$VITE_SUPABASE_URL" dist/assets
          grep -R -F -q "$VITE_SUPABASE_ANON_KEY" dist/assets
      - name: Force a fresh Cloudflare asset manifest
        run: echo "${GITHUB_SHA}-${GITHUB_RUN_ID}" > dist/build-marker.txt
      - name: Deploy Worker to Cloudflare
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure Cloudflare TURN for WebRTC when account permissions allow it
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_names="$(npx wrangler@4 secret list --name customs --format json)"
          has_key_id="$(printf '%s' "$secret_names" | jq -r 'any(.[]; .name == "TURN_KEY_ID_V2")')"
          has_api_token="$(printf '%s' "$secret_names" | jq -r 'any(.[]; .name == "TURN_API_TOKEN_V2")')"
          if [ "$has_key_id" = "true" ] && [ "$has_api_token" = "true" ]; then
            echo "Cloudflare TURN credentials already exist; keeping the current key."
            exit 0
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/calls/turn_keys"
          http_code="$(curl --silent --show-error --max-time 30 -o /tmp/turn-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"customs-os-production"}' "$api")"

          if [ "$http_code" = "403" ]; then
            echo "::warning::Cloudflare TURN key creation is forbidden for the current API token. WebRTC will use the secured STUN fallback until Calls:Edit permission is granted."
            exit 0
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Cloudflare TURN key creation failed with HTTP $http_code"
            cat /tmp/turn-response.json
            exit 1
          fi

          key_id="$(jq -r '.result.uid // empty' /tmp/turn-response.json)"
          turn_key="$(jq -r '.result.key // empty' /tmp/turn-response.json)"
          test -n "$key_id"
          test -n "$turn_key"
          printf '%s' "$key_id" | npx wrangler@4 secret put TURN_KEY_ID_V2 --name customs
          printf '%s' "$turn_key" | npx wrangler@4 secret put TURN_API_TOKEN_V2 --name customs
      - name: Smoke test live Worker and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for base in "https://darbandicommercial.ir"; do
            echo "Checking $base/"
            success=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 30 -o /tmp/index.html "$base/"; then
                success=1
                break
              fi
              echo "Attempt $attempt failed; retrying $base/..."
              sleep 10
            done
            test "$success" = 1
            grep -q '<div id="root">' /tmp/index.html
            script_src="$(sed -n 's/.*<script[^>]*type="module"[^>]*src="\([^"]*\)".*/\1/p' /tmp/index.html | head -n 1)"
            test -n "$script_src"
            case "$script_src" in /assets/*.js) ;; *) echo "Invalid deployed module path: $script_src"; exit 1;; esac
            echo "Checking $base$script_src"
            curl --fail --silent --show-error --location --max-time 30 -o /tmp/app.js "$base$script_src"
            test -s /tmp/app.js
            if grep -qi '<!doctype html' /tmp/app.js; then echo "Deployed module returned HTML instead of JavaScript"; exit 1; fi

            echo "Checking dedicated chat entrypoint"
            curl --fail --silent --show-error --location --max-time 30 -o /tmp/chat.html "$base/chat"
            grep -q '<title>چت سازمانی | Customs OS</title>' /tmp/chat.html
            grep -q 'chat-app-v4.webmanifest?v=20261005-chat-v4' /tmp/chat.html
            curl --fail --silent --show-error --location --max-time 20 -o /tmp/chat-icon.svg "$base/chat-icon.svg${smoke_qs}"
            test -s /tmp/chat-icon.svg
            chat_manifest_href="/chat-app-v4.webmanifest?v=20261005-chat-v4"
            curl --fail --silent --show-error --location --max-time 20 -o /tmp/chat-manifest.json "${base}${chat_manifest_href}&__chat_smoke=${GITHUB_SHA}-${GITHUB_RUN_ID}"
            grep -q '"start_url": "/chat"' /tmp/chat-manifest.json
            grep -q '"scope": "/chat"' /tmp/chat-manifest.json
            grep -q '"id": "/chat"' /tmp/chat-manifest.json
            ice_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/ice.json -w '%{http_code}' "${base}/api/webrtc/ice")"
            test "$ice_status" = 401

            echo "Checking dedicated chat subdomain"
          chat_base="https://chat.darbandicommercial.ir"
          curl --fail --silent --show-error --location --max-time 30 -o /tmp/chat-subdomain.html "$chat_base/?__chat_smoke=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          grep -q '<title>چت سازمانی | Customs OS</title>' /tmp/chat-subdomain.html
          grep -q 'chat-subdomain.webmanifest?v=20261006-chat-subdomain-v2' /tmp/chat-subdomain.html
          curl --fail --silent --show-error --location --max-time 20 -o /tmp/chat-subdomain-manifest.json "$chat_base/chat-subdomain.webmanifest?v=20261006-chat-subdomain-v2&__chat_smoke=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          grep -q '"start_url": "/"' /tmp/chat-subdomain-manifest.json
          grep -q '"scope": "/"' /tmp/chat-subdomain-manifest.json
          grep -q '"id": "/"' /tmp/chat-subdomain-manifest.json

          echo "Checking PWA legacy launch URL canonicalization"
            pwa_headers="$(curl --silent --show-error --max-time 20 -D - -o /dev/null "${base}/?source=pwa")"
            pwa_location="$(printf '%s\n' "$pwa_headers" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, "", $0); sub(/^[^:]*:[[:space:]]*/, "", $0); print; exit}')"
            echo "PWA redirect Location: $pwa_location"
            test "$pwa_location" = "${base}/chat"

            echo "Checking live-voice code is present in compiled bundle"
            grep -R -F -q 'تماس صوتی زنده' dist/assets
            grep -R -F -q 'RTCPeerConnection' dist/assets

            js_count="$(find dist/assets -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
            test "$js_count" -ge 1
            echo "Compiled JavaScript asset count: $js_count"
          done
          echo "Production custom domain smoke test passed."

          echo "Checking optional workers.dev endpoint"
          if curl --fail --silent --show-error --location --max-time 20 -o /tmp/workers-dev.html "https://customs.mohsen-darbandi.workers.dev/"; then
            grep -q '<div id="root">' /tmp/workers-dev.html
            echo "Optional workers.dev endpoint is healthy."
          else
            echo "workers.dev is optional for production; continuing."
          fi

      - name: Browser runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          cat > live-runtime-smoke.spec.mjs <<'EOF'
          import { test, expect } from 'playwright/test';

          for (const baseURL of [
            'https://darbandicommercial.ir',
          ]) {
            test(`runtime boot: ${baseURL}`, async ({ page }) => {
              const errors = [];
              const scriptResponses = [];
              page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
              page.on('console', (message) => {
                if (message.type() === 'error') errors.push(`console: ${message.text()}`);
              });
              page.on('requestfailed', (request) => {
                const url = request.url();
                if (/\\.(js|mjs)(\\?|$)/i.test(url)) {
                  errors.push(`requestfailed: ${url} — ${request.failure()?.errorText || 'unknown'}`);
                }
              });
              page.on('response', (response) => {
                const url = response.url();
                if (/\\.(js|mjs)(\\?|$)/i.test(url)) {
                  scriptResponses.push(`${response.status()} ${response.headers()['content-type'] || 'NO_CONTENT_TYPE'} ${url}`);
                }
              });

              await page.goto(baseURL, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => undefined);
              await expect(page.locator('#root')).toBeAttached();
              await expect.poll(
                async () => (await page.locator('#root').innerText()).trim(),
                { timeout: 15000, message: `React did not render visible content into #root\nErrors: ${errors.join(' | ') || 'none'}\nScripts: ${scriptResponses.join(' | ') || 'none'}` },
              ).not.toBe('');

              const chatPage = await page.context().newPage();
              await chatPage.goto(baseURL + '/chat', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await chatPage.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => undefined);
              await expect(chatPage.locator('#root')).toBeAttached();
              await expect.poll(
                async () => (await chatPage.locator('#root').innerText()).trim(),
                { timeout: 15000, message: 'Chat route did not render visible content into #root' },
              ).not.toBe('');
              await expect(chatPage).toHaveTitle(/چت سازمانی/);
              const chatBody = (await chatPage.locator('#root').innerText()).trim();
              if (!chatBody) throw new Error('Chat entry did not produce a rendered root');
              const chatPath = new URL(chatPage.url()).pathname;
              if (chatPath !== '/chat' && chatPath !== '/login') {
                throw new Error(`Unexpected chat navigation path: ${chatPath}`);
              }
              await chatPage.close();

              if (errors.length) {
                throw new Error(errors.join('\n'));
              }
            });
          }
          EOF
          npx playwright test live-runtime-smoke.spec.mjs --reporter=line
          rm -f live-runtime-smoke.spec.mjs

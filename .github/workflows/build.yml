name: Customs OS Build

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

concurrency:
  group: customs-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://bjngfgiecvihofemptub.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_pIh0yF6SQcQ-IAa_FkbjWA_qTSm83Sr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Local Playwright mobile shell geometry smoke test
        if: github.ref == 'refs/heads/fix/mobile-phase1-shell-consistency-2026-11-14' || github.ref == 'refs/heads/fix/mobile-phase2-keyboard-scroll-2026-11-14'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/customs-os-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/reminders/login -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/customs-os-preview.log
            echo "Local Vite preview did not become ready."
            exit 1
          fi
          cat > mobile-shell-local-smoke.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
            });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:4173/reminders/login?__local_mobile_shell_smoke=1', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await page.waitForSelector('.app-mobilebar.native-app-header', { timeout: 20000 });
            await page.waitForSelector('.app-mobile-viewport-dock', { timeout: 20000 });

            await page.evaluate(() => {
              const shell = document.createElement('div');
              shell.className = 'app-shell is-touch-layout is-chat-route';
              const status = document.createElement('div');
              status.className = 'native-system-status';
              const header = document.createElement('header');
              header.className = 'app-mobilebar native-app-header';
              const main = document.createElement('main');
              main.className = 'app-main is-chat-main';
              const content = document.createElement('div');
              content.className = 'app-content is-chat-content';
              const stage = document.createElement('div');
              stage.className = 'future-route-stage is-chat-stage';
              const chat = document.createElement('div');
              chat.className = 'chat-standalone';
              chat.dataset.chatSelected = 'true';
              const conversation = document.createElement('section');
              conversation.className = 'chat-conversation-view';
              const conversationHeader = document.createElement('header');
              conversationHeader.className = 'chat-conversation-header';
              const messages = document.createElement('div');
              messages.className = 'chat-message-area';
              const composer = document.createElement('div');
              composer.className = 'chat-composer';
              composer.style.height = '58px';
              conversation.append(conversationHeader, messages, composer);
              chat.append(conversation);
              stage.append(chat);
              content.append(stage);
              main.append(content);
              shell.append(status, header, main);
              document.body.append(shell);
            });

            const results = [];
            for (const width of [320, 360, 375, 390, 414, 430]) {
              await page.setViewportSize({ width, height: 844 });
              const m = await page.evaluate(() => {
                const rootStyle = getComputedStyle(document.documentElement);
                const dock = document.querySelector('.app-mobile-viewport-dock');
                const header = document.querySelector('.app-shell:not(.is-chat-route) .app-mobilebar');
                const chatContent = document.querySelector('.app-content.is-chat-content');
                const composer = document.querySelector('.chat-composer');
                const rect = element => {
                  if (!element) return null;
                  const r = element.getBoundingClientRect();
                  return { left: Math.round(r.left), right: Math.round(r.right), top: Math.round(r.top), bottom: Math.round(r.bottom), width: Math.round(r.width), height: Math.round(r.height) };
                };
                const dockRect = rect(dock);
                const composerRect = rect(composer);
                return {
                  width: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  dock: dockRect,
                  header: rect(header),
                  dockToken: parseFloat(rootStyle.getPropertyValue('--cos-tab-height')) || -1,
                  contentReserve: chatContent ? parseFloat(getComputedStyle(chatContent).paddingBottom) || 0 : 0,
                  composerClearance: dockRect && composerRect ? dockRect.top - composerRect.bottom : -999,
                  dockPosition: dock ? getComputedStyle(dock).position : 'missing',
                  dockDisplay: dock ? getComputedStyle(dock).display : 'missing',
                };
              });
              assert.equal(m.width, width, JSON.stringify(m));
              assert.ok(m.documentWidth <= width + 1, JSON.stringify(m));
              assert.equal(m.dockPosition, 'fixed', JSON.stringify(m));
              assert.notEqual(m.dockDisplay, 'none', JSON.stringify(m));
              assert.equal(m.dock?.height, m.dockToken, JSON.stringify(m));
              assert.equal(m.dock?.left, 0, JSON.stringify(m));
              assert.equal(m.dock?.right, width, JSON.stringify(m));
              assert.equal(m.dock?.bottom, 844, JSON.stringify(m));
              assert.ok(m.contentReserve >= m.dockToken, JSON.stringify(m));
              assert.ok(m.composerClearance >= 0, JSON.stringify(m));
              assert.equal(m.header?.height, 62, JSON.stringify(m));
              results.push(m);
            }

            await page.setViewportSize({ width: 390, height: 600 });
            const compact = await page.evaluate(() => {
              const rootStyle = getComputedStyle(document.documentElement);
              const dock = document.querySelector('.app-mobile-viewport-dock');
              const chatContent = document.querySelector('.app-content.is-chat-content');
              const composer = document.querySelector('.chat-composer');
              const dockRect = dock?.getBoundingClientRect();
              const composerRect = composer?.getBoundingClientRect();
              return {
                dockHeight: dockRect ? Math.round(dockRect.height) : -1,
                dockLeft: dockRect ? Math.round(dockRect.left) : -1,
                dockRight: dockRect ? Math.round(dockRect.right) : -1,
                dockBottom: dockRect ? Math.round(dockRect.bottom) : -1,
                dockToken: parseFloat(rootStyle.getPropertyValue('--cos-tab-height')) || -1,
                contentReserve: chatContent ? parseFloat(getComputedStyle(chatContent).paddingBottom) || 0 : 0,
                composerClearance: dockRect && composerRect ? Math.round(dockRect.top - composerRect.bottom) : -999,
              };
            });
            assert.equal(compact.dockHeight, 52, JSON.stringify(compact));
            assert.equal(compact.dockToken, 52, JSON.stringify(compact));
            assert.equal(compact.dockLeft, 0, JSON.stringify(compact));
            assert.equal(compact.dockRight, 390, JSON.stringify(compact));
            assert.equal(compact.dockBottom, 600, JSON.stringify(compact));
            assert.ok(compact.contentReserve >= compact.dockHeight, JSON.stringify(compact));
            assert.ok(compact.composerClearance >= 0, JSON.stringify(compact));
            // Simulate the iOS visual viewport shrinking after an editable field
            // receives focus. This verifies the dock remains visible on a non-chat
            // route, and that the app-content scroller keeps its reserved clearance.
            const keyboardPage = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
            });
            await keyboardPage.addInitScript(() => {
              const listeners = new Map();
              const fakeViewport = {
                width: window.innerWidth,
                height: window.innerHeight,
                offsetTop: 0,
                offsetLeft: 0,
                scale: 1,
                addEventListener(type, listener) {
                  const entries = listeners.get(type) || [];
                  entries.push(listener);
                  listeners.set(type, entries);
                },
                removeEventListener(type, listener) {
                  listeners.set(type, (listeners.get(type) || []).filter(entry => entry !== listener));
                },
                dispatchEvent(event) {
                  for (const listener of listeners.get(event.type) || []) listener.call(fakeViewport, event);
                  return true;
                },
              };
              Object.defineProperty(window, 'visualViewport', {
                configurable: true,
                get: () => fakeViewport,
              });
              Object.defineProperty(window, '__setFakeVisualViewportHeight', {
                configurable: true,
                value(height) {
                  fakeViewport.height = height;
                  fakeViewport.dispatchEvent(new Event('resize'));
                },
              });
            });
            await keyboardPage.goto('http://127.0.0.1:4173/reminders/login?__keyboard_viewport_smoke=1', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await keyboardPage.waitForSelector('.app-mobile-viewport-dock', { timeout: 20000 });
            const keyboard = await keyboardPage.evaluate(async () => {
              const shell = document.querySelector('.app-shell.is-touch-layout');
              const input = document.querySelector('input[type="email"], input[type="text"], input:not([type="hidden"])');
              const dock = document.querySelector('.app-mobile-viewport-dock');
              const content = shell?.querySelector('.app-content');
              if (!shell || !input || !dock || !content) throw new Error('Mobile login viewport elements are missing');

              const horizontal = document.createElement('div');
              horizontal.className = 'overflow-x-auto';
              horizontal.style.width = '100%';
              horizontal.style.height = '32px';
              const wideContent = document.createElement('div');
              wideContent.style.width = '780px';
              wideContent.style.height = '24px';
              horizontal.append(wideContent);
              content.append(horizontal);

              input.focus();
              window.__setFakeVisualViewportHeight(500);
              await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
              const dockRect = dock.getBoundingClientRect();
              const shellRect = shell.getBoundingClientRect();
              const horizontalStyle = getComputedStyle(horizontal);
              const keyboardState = {
                active: shell.classList.contains('is-mobile-keyboard-open'),
                shellHeight: Math.round(shellRect.height),
                shellBottom: Math.round(shellRect.bottom),
                dockTop: Math.round(dockRect.top),
                dockBottom: Math.round(dockRect.bottom),
                dockHeight: Math.round(dockRect.height),
                contentOverflowY: getComputedStyle(content).overflowY,
                horizontalOverflowX: horizontalStyle.overflowX,
                horizontalOverflowY: horizontalStyle.overflowY,
                horizontalTouchAction: horizontalStyle.touchAction,
                documentWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
              };

              input.blur();
              window.__setFakeVisualViewportHeight(844);
              await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
              keyboardState.restored = !shell.classList.contains('is-mobile-keyboard-open');
              keyboardState.restoredDockBottom = Math.round(dock.getBoundingClientRect().bottom);
              return keyboardState;
            });
            assert.equal(keyboard.active, true, JSON.stringify(keyboard));
            assert.equal(keyboard.shellHeight, 500, JSON.stringify(keyboard));
            assert.equal(keyboard.shellBottom, 500, JSON.stringify(keyboard));
            assert.ok(keyboard.dockTop >= 0 && keyboard.dockBottom <= 500, JSON.stringify(keyboard));
            assert.equal(keyboard.dockHeight, 52, JSON.stringify(keyboard));
            assert.equal(keyboard.contentOverflowY, 'auto', JSON.stringify(keyboard));
            assert.equal(keyboard.horizontalOverflowX, 'auto', JSON.stringify(keyboard));
            assert.equal(keyboard.horizontalOverflowY, 'hidden', JSON.stringify(keyboard));
            assert.equal(keyboard.horizontalTouchAction, 'pan-x pan-y', JSON.stringify(keyboard));
            assert.ok(keyboard.documentWidth <= keyboard.viewportWidth + 1, JSON.stringify(keyboard));
            assert.equal(keyboard.restored, true, JSON.stringify(keyboard));
            assert.ok(keyboard.restoredDockBottom <= 844, JSON.stringify(keyboard));
            await keyboardPage.close();

            assert.equal(pageErrors.length, 0, pageErrors.join(' | '));
            console.log('Local mobile shell and keyboard geometry passed:', JSON.stringify({ widths: results, compact, keyboard }));
          } finally {
            await browser.close();
          }
          EOF
          node mobile-shell-local-smoke.mjs
      - name: Prevent browser-side weather and map provider requests
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'https?://(api|marine-api)\.open-meteo\.com' src; then
            echo "Weather and marine provider calls must go through the Cloudflare Worker."
            exit 1
          fi
          if grep -R -n -F -e 'tile.openstreetmap.org' -e 'openstreetmap.org/export/embed.html' src; then
            echo "Map tiles and embedded maps must use the first-party Cloudflare path."
            exit 1
          fi
          echo "No direct browser weather or map tile provider requests found."
      - name: Verify production Supabase client uses the same-origin proxy
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F -q "$VITE_SUPABASE_ANON_KEY" dist/assets
          grep -R -F -q "location.origin" dist/assets

name: verify-build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Assert AI Operator static import
        run: |
          ! grep -R "React\\.lazy.*AIOperatorPanel\\|import('../../components/AIOperatorPanel')" src/features/chat/ChatPage.tsx
          grep -F "import {AIOperatorPanel as ChatAIOperatorPanel}" src/features/chat/ChatPage.tsx

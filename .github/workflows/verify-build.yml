name: verify-chat-modern-final

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build (final messenger)
        run: npm run build
      - name: Mobile chat and reminders keyboard viewport smoke
        if: github.head_ref == 'ui/mobile-phase2-chat-reminders-2026-11-14'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/customs-os-preview-phase2.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/reminders/login -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/customs-os-preview-phase2.log
            echo "Local Vite preview did not become ready."
            exit 1
          fi
          node scripts/mobile-chat-reminders-smoke.mjs
      - name: Messenger gateway Deno check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase messenger function
        run: deno check supabase/functions/messenger-gateway/index.ts
      - name: Cloudflare Worker dry run
        run: npx wrangler@4 deploy --dry-run

      - name: Keep AI Operator available without floating over the chat inbox
        run: |
          ! grep -F "React.lazy" src/components/AIOperatorPanel.tsx
          ! grep -F "ChatAIOperatorPanel" src/features/chat/ChatPage.tsx
          grep -F "export const CustomsAIOperatorPanel" src/components/AIOperatorPanel.tsx
          grep -F "!location.pathname.startsWith('/chat') && <AIWorkspace pageContext={location.pathname + location.search} />" src/components/AppShell.tsx

name: verify-chat-modern-final

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VITE_SUPABASE_URL: https://bjngfgiecvihofemptub.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_pIh0yF6SQcQ-IAa_FkbjWA_qTSm83Sr
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: customs_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Create isolated AI Operator ledger ACL database
        run: createdb ai_operator_ledger_test

      - name: Create AI Operator ledger ACL fixture
        run: PGDATABASE=ai_operator_ledger_test psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/ai_operator_ledger_acl_fixture.sql

      - name: Apply server-owned AI Operator ledger migration
        run: PGDATABASE=ai_operator_ledger_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117184500_ai_operator_server_owned_ledger.sql

      - name: Verify AI Operator ledger ACL and trusted audit flow
        run: PGDATABASE=ai_operator_ledger_test psql -v ON_ERROR_STOP=1 -f supabase/tests/20261117_ai_operator_ledger_acl.test.sql

      - name: Create isolated customs workflow fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/customs_workflow_atomic_fixture.sql

      - name: Apply candidate customs workflow migration on ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117011900_customs_workflow_atomic_activity_and_server_exit_gate.sql

      - name: Run PostgreSQL concurrency, rollback, RLS and exit-release contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/20261117_customs_workflow_atomic_activity.test.sql

      - name: Apply daily customs digest idempotency migration on ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117140000_customs_daily_digest_delivery_idempotency.sql

      - name: Verify daily customs digest idempotency and service-role boundary
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/20261117_customs_daily_digest_idempotency.test.sql

      - name: Run two-session concurrent workflow patch test
        run: bash supabase/tests/run_customs_workflow_atomic_concurrency.sh

      - name: Create isolated AI Operator ledger ACL database
        run: createdb ai_operator_ledger_test
      - name: Create AI Operator ledger ACL fixture
        run: PGDATABASE=ai_operator_ledger_test psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/ai_operator_ledger_acl_fixture.sql
      - name: Apply server-owned AI Operator ledger migration
        run: PGDATABASE=ai_operator_ledger_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117184500_ai_operator_server_owned_ledger.sql
      - name: Verify AI Operator ledger ACL and trusted audit flow
        run: PGDATABASE=ai_operator_ledger_test psql -v ON_ERROR_STOP=1 -f supabase/tests/20261117_ai_operator_ledger_acl.test.sql


      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build (final messenger)
        run: npm run build
      - name: Mobile chat and reminders keyboard viewport smoke
        if: github.head_ref == 'ui/mobile-phase2-chat-reminders-2026-11-14'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/customs-os-preview-phase2.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/reminders/login -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/customs-os-preview-phase2.log
            echo "Local Vite preview did not become ready."
            exit 1
          fi
          node scripts/mobile-chat-reminders-smoke.mjs
      - name: Messenger gateway Deno check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase messenger function
        run: deno check supabase/functions/messenger-gateway/index.ts

      - name: Check Supabase reminder function
        run: deno check --node-modules-dir=auto supabase/functions/send-reminders/index.ts
      - name: Check Supabase AI Operator function
        run: deno check --node-modules-dir=auto supabase/functions/ai-operator/index.ts
      - name: Check Supabase AI Operator function
        run: deno check --node-modules-dir=auto supabase/functions/ai-operator/index.ts
      - name: Cloudflare Worker dry run
        run: npx wrangler@4 deploy --dry-run

      - name: Keep AI Operator available without floating over the chat inbox
        run: |
          ! grep -F "React.lazy" src/components/AIOperatorPanel.tsx
          ! grep -F "ChatAIOperatorPanel" src/features/chat/ChatPage.tsx
          grep -F "export const CustomsAIOperatorPanel" src/components/AIOperatorPanel.tsx
          grep -F "!location.pathname.startsWith('/chat') && <AIWorkspace pageContext={location.pathname + location.search} />" src/components/AppShell.tsx

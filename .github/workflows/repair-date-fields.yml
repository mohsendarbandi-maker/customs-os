name: Repair dashboard date fields

on:
  push:
    paths:
      - '.github/workflows/repair-date-fields.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore dashboard and apply date fix
        shell: bash
        run: |
          set -e
          git show 0dc23883e94360d0115b5e63246dd676168c19a1:src/pages/DashboardPage.tsx > src/pages/DashboardPage.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/DashboardPage.tsx')
          s = p.read_text()
          marker = "const cleanValue = (v: string) => v.trim().replace(/^['\"“”]+|['\"“”]+$/g, '').trim();\n"
          helper = marker + "\n// Convert Jalali/Persian dates (e.g. 1405/02/29) to Gregorian YYYY-MM-DD for PostgreSQL date columns.\nconst normalizeDateForDb = (value: string | null | undefined): string | null => {\n  const raw = (value || '').trim();\n  if (!raw) return null;\n  const normalized = raw.replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[.-]/g, '/');\n  const parts = normalized.split('/').map(Number);\n  if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return raw;\n  let [y, m, d] = parts;\n  if (y >= 1300 && y <= 1600) {\n    y -= 979;\n    let gy = 1600 + 400 * Math.floor(y / 12053);\n    y %= 12053;\n    gy += 4 * Math.floor(y / 1461);\n    y %= 1461;\n    if (y > 365) { gy += Math.floor((y - 1) / 365); y = (y - 1) % 365; }\n    let days = y * 365 + Math.floor(y / 4) + (m <= 6 ? (m - 1) * 31 : (m - 7) * 30 + 186) + (d - 1);\n    const leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;\n    const monthDays = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];\n    let gm = 1;\n    while (days >= monthDays[gm - 1]) { days -= monthDays[gm - 1]; gm++; }\n    return `${gy}-${String(gm).padStart(2, '0')}-${String(days + 1).padStart(2, '0')}`;\n  }\n  if (y >= 1900 && y <= 2200) return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;\n  return raw;\n};\n"
          if marker not in s:
              raise SystemExit('date helper marker not found')
          s = s.replace(marker, helper, 1)
          s = s.replace('p_order_date:caseForm.regDate||null', 'p_order_date:normalizeDateForDb(caseForm.regDate)')
          s = s.replace('p_unloading_date:operationForm.unloadingDate||null', 'p_unloading_date:normalizeDateForDb(operationForm.unloadingDate)')
          s = s.replace('p_warehouse_receipt_date:operationForm.warehouseReceiptDate||null', 'p_warehouse_receipt_date:normalizeDateForDb(operationForm.warehouseReceiptDate)')
          s = s.replace('p_declaration_date:new Date(`${declarationForm.declarationDate}T00:00:00`).toISOString()', 'p_declaration_date:normalizeDateForDb(declarationForm.declarationDate)')
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-date-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/DashboardPage.tsx .github/workflows/repair-date-fields.yml
          git commit -m 'Fix Persian date values sent to PostgreSQL'
          git push origin HEAD:main

name: Complete maritime dashboard fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard, settings and shipment directory
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('src/pages/DashboardPage.tsx')
          s=p.read_text(encoding='utf-8')
          if "../components/MaritimeTab" not in s:
              s=s.replace("import { useAuth } from '../context/AuthContext';", "import { useAuth } from '../context/AuthContext';\nimport { MaritimeTab } from '../components/MaritimeTab';")
          s=s.replace("useState<'home'|'case'|'operation'|'valuation'|'declaration'>('case')", "useState<'home'|'case'|'operation'|'maritime'|'valuation'|'declaration'>('case')")
          old=re.compile(r"// Convert Jalali/Persian dates.*?const parseSmartPaste", re.S)
          new="""// Convert Jalali/Persian dates to Gregorian YYYY-MM-DD for PostgreSQL date columns.\nconst normalizeDateForDb = (value: string | null | undefined): string | null => {\n  const raw = (value || '').trim();\n  if (!raw) return null;\n  const normalized = raw.replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[.-]/g, '/');\n  const parts = normalized.split('/').map(Number);\n  if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return raw;\n  const [y,m,d] = parts;\n  if (y >= 1900 && y <= 2200) return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n  if (y < 1300 || y > 1600) return raw;\n  const target = `${y}-${m}-${d}`;\n  const fmt = new Intl.DateTimeFormat('en-US-u-ca-persian', { year:'numeric', month:'numeric', day:'numeric', timeZone:'UTC' });\n  const start = Date.UTC(y + 621, 2, 19);\n  for (let i=0; i<380; i++) {\n    const dt = new Date(start + i * 86400000);\n    const parts = fmt.formatToParts(dt);\n    const py = Number(parts.find(x=>x.type==='year')?.value);\n    const pm = Number(parts.find(x=>x.type==='month')?.value);\n    const pd = Number(parts.find(x=>x.type==='day')?.value);\n    if (`${py}-${pm}-${pd}` === target) return dt.toISOString().slice(0,10);\n  }\n  return raw;\n};\n\nconst parseSmartPaste"""
          if old.search(s): s=old.sub(new,s,count=1)
          marker="<button onClick={()=>setActiveTab('operation')}"
          if marker in s and "setActiveTab('maritime')" not in s:
              idx=s.index(marker); end=s.index('</button>',idx)+len('</button>')
              btn="<button onClick={()=>setActiveTab('maritime')} className={`p-4 rounded-2xl border text-right ${activeTab==='maritime'?'border-cyan-500 bg-cyan-500/10':'border-slate-800 bg-slate-900/50'}`}><Anchor className=\"mb-2 text-cyan-400\" size={20}/><b className=\"text-sm\">کشتیرانی / Maritime</b><div className=\"text-[11px] text-slate-500 mt-1\">B/L + کشتی + رهگیری</div></button>"
              s=s[:end]+btn+s[end:]
          render_marker="{activeTab==='valuation'&&"
          if render_marker in s and "<MaritimeTab caseId={caseId}" not in s:
              s=s.replace(render_marker, "{activeTab==='maritime'&&<MaritimeTab caseId={caseId} onMessage={(type,text)=>setStatusMessage({type,text})}/>}\n\n      "+render_marker, 1)
          p.write_text(s,encoding='utf-8')

          m=Path('src/components/MaritimeTab.tsx')
          if m.exists():
              ms=m.read_text(encoding='utf-8').replace("data.shippinging_line||data.shipping_line||''", "data.shipping_line||''")
              m.write_text(ms,encoding='utf-8')

          # LucideIcon accepts string|number for size; these local component contracts were too narrow.
          sp=Path('src/pages/SettingsPage.tsx')
          ss=sp.read_text(encoding='utf-8')
          ss=ss.replace('icon:React.ComponentType<{size?:number;className?:string}>','icon:any')
          ss=ss.replace('icon?:React.ComponentType<{size?:number}>','icon?:any')
          sp.write_text(ss,encoding='utf-8')

          # Prevent stale React state when OCR discovers a new shipping line and vessel in one save operation.
          vp=Path('src/pages/ShipmentFirstPage.tsx')
          vs=vp.read_text(encoding='utf-8')
          vs=re.sub(r"const createVessel=async\(nameOverride\?:string,imoOverride\?:string\)=>\{.*?\n const runAI=", '''const createVessel=async(lineIdOverride?:string,nameOverride?:string,imoOverride?:string)=>{if(!profile?.organization_id)return null;const targetLineId=lineIdOverride||lineId;const name=clean(nameOverride||newVesselName);const imo=clean(imoOverride||newVesselIMO).replace(/\\D/g,'');if(!targetLineId)return setStatus('ابتدا کشتیرانی را انتخاب یا ثبت کنید.'),null;if(!name)return setStatus('نام کشتی جدید را وارد کنید.'),null;if(imo&&!/^\\d{7}$/.test(imo))return setStatus('IMO باید ۷ رقم باشد.'),null;const{data:existing,error:qe}=await supabase.from('vessels').select('id,name,imo_number,shipping_line_id').eq('organization_id',profile.organization_id).ilike('name',name).maybeSingle();if(qe)throw qe;if(existing){if(existing.shipping_line_id!==targetLineId){const{data:moved,error:me}=await supabase.from('vessels').update({shipping_line_id:targetLineId,imo_number:existing.imo_number||imo||null}).eq('id',existing.id).select('id,name,imo_number,shipping_line_id').single();if(me)throw me;setVesselId(moved.id);set('vesselName',moved.name);set('imo',moved.imo_number||imo);return moved}setVesselId(existing.id);set('vesselName',existing.name);set('imo',existing.imo_number||imo);return existing}const{data,error}=await supabase.from('vessels').insert({organization_id:profile.organization_id,name,imo_number:imo||null,shipping_line_id:targetLineId}).select('id,name,imo_number,shipping_line_id').single();if(error)throw error;const row=data as Vessel;setVessels(p=>[...p,row].sort((a,b)=>a.name.localeCompare(b.name)));setVesselId(row.id);set('vesselName',row.name);if(row.imo_number)set('imo',row.imo_number);setNewVesselName('');setNewVesselIMO('');setStatus(`کشتی «${row.name}» برای «${input.shippingLine}» ذخیره شد.`);return row};\n const runAI=''',vs,count=1,flags=re.S)
          vs=re.sub(r"const ensureDirectoryRecords=async\(\)=>\{.*?\n const save=", '''const ensureDirectoryRecords=async()=>{let l=lines.find(x=>same(x.name,input.shippingLine));if(!l){const{data:found,error:qe}=await supabase.from('shipping_lines').select('id,name,name_fa').eq('organization_id',profile?.organization_id||'').ilike('name',input.shippingLine.trim()).maybeSingle();if(qe)throw qe;if(found)l=found as Line}if(!l)l=await createLine(input.shippingLine);if(!l)return null;setLineId(l.id);const{data:existing,error:ve}=await supabase.from('vessels').select('id,name,imo_number,shipping_line_id').eq('organization_id',profile?.organization_id||'').ilike('name',input.vesselName.trim()).maybeSingle();if(ve)throw ve;let v=existing as Vessel|null;if(v&&v.shipping_line_id!==l.id){const{data:moved,error:me}=await supabase.from('vessels').update({shipping_line_id:l.id,imo_number:v.imo_number||input.imo}).eq('id',v.id).select('id,name,imo_number,shipping_line_id').single();if(me)throw me;v=moved as Vessel}if(!v)v=await createVessel(l.id,input.vesselName,input.imo);if(!v)return null;setVesselId(v.id);return{line:l,vessel:v}};\n const save=''',vs,count=1,flags=re.S)
          vp.write_text(vs,encoding='utf-8')

      - name: Build and typecheck
        run: |
          node --version
          npm --version
          npm install
          npm run build
          npx tsc --noEmit

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardPage.tsx src/components/MaritimeTab.tsx src/pages/SettingsPage.tsx src/pages/ShipmentFirstPage.tsx .github/workflows/complete-maritime-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: complete shipment directory workflow and typecheck"
            git push
          fi

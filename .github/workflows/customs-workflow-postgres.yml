name: Customs Workflow PostgreSQL Contract Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/migrations/20261117011900_customs_workflow_atomic_activity_and_server_exit_gate.sql"
      - "supabase/tests/fixtures/customs_workflow_atomic_fixture.sql"
      - "supabase/tests/20261117_customs_workflow_atomic_activity.test.sql"
      - ".github/workflows/customs-workflow-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-contract:
    name: PostgreSQL ${{ matrix.postgres }} contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: customs_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Create isolated test schema and RLS fixtures
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/customs_workflow_atomic_fixture.sql

      - name: Apply candidate workflow migration to ephemeral PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117011900_customs_workflow_atomic_activity_and_server_exit_gate.sql

      - name: Run database concurrency, rollback, RLS and exit-release contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/20261117_customs_workflow_atomic_activity.test.sql

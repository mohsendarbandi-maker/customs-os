name: Repair integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair known typecheck and shipment-state issues
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/pages/SettingsPage.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('icon:React.ComponentType<{size?:number;className?:string}>','icon:any')
          s=s.replace('icon?:React.ComponentType<{size?:number}>','icon?:any')
          p.write_text(s,encoding='utf-8')
          p=Path('src/pages/ShipmentFirstPage.tsx')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const createVessel=async\(nameOverride\?:string,imoOverride\?:string\)=>\{.*?\n const runAI=", '''const createVessel=async(lineIdOverride?:string,nameOverride?:string,imoOverride?:string)=>{if(!profile?.organization_id)return null;const targetLineId=lineIdOverride||lineId;const name=clean(nameOverride||newVesselName);const imo=clean(imoOverride||newVesselIMO).replace(/\\D/g,'');if(!targetLineId)return setStatus('ابتدا کشتیرانی را انتخاب یا ثبت کنید.'),null;if(!name)return setStatus('نام کشتی جدید را وارد کنید.'),null;if(imo&&!/^\\d{7}$/.test(imo))return setStatus('IMO باید ۷ رقم باشد.'),null;const{data:existing,error:qe}=await supabase.from('vessels').select('id,name,imo_number,shipping_line_id').eq('organization_id',profile.organization_id).ilike('name',name).maybeSingle();if(qe)throw qe;if(existing){const v=existing as Vessel;if(v.shipping_line_id!==targetLineId){const{data:moved,error:me}=await supabase.from('vessels').update({shipping_line_id:targetLineId,imo_number:v.imo_number||imo||null}).eq('id',v.id).select('id,name,imo_number,shipping_line_id').single();if(me)throw me;setVesselId(moved.id);set('vesselName',moved.name);set('imo',moved.imo_number||imo);return moved as Vessel}setVesselId(v.id);set('vesselName',v.name);set('imo',v.imo_number||imo);return v}const{data,error}=await supabase.from('vessels').insert({organization_id:profile.organization_id,name,imo_number:imo||null,shipping_line_id:targetLineId}).select('id,name,imo_number,shipping_line_id').single();if(error)throw error;const row=data as Vessel;setVessels(p=>[...p,row].sort((a,b)=>a.name.localeCompare(b.name)));setVesselId(row.id);set('vesselName',row.name);if(row.imo_number)set('imo',row.imo_number);setNewVesselName('');setNewVesselIMO('');return row};\n const runAI=''',s,count=1,flags=re.S)
          s=re.sub(r"const ensureDirectoryRecords=async\(\)=>\{.*?\n const save=", '''const ensureDirectoryRecords=async()=>{let l=lines.find(x=>same(x.name,input.shippingLine)||(x.name_fa&&same(x.name_fa,input.shippingLine)));if(!l){const{data:found,error:qe}=await supabase.from('shipping_lines').select('id,name,name_fa').eq('organization_id',profile?.organization_id||'').ilike('name',input.shippingLine.trim()).maybeSingle();if(qe)throw qe;if(found)l=found as Line}if(!l)l=await createLine(input.shippingLine);if(!l)return null;setLineId(l.id);const{data:existing,error:ve}=await supabase.from('vessels').select('id,name,imo_number,shipping_line_id').eq('organization_id',profile?.organization_id||'').ilike('name',input.vesselName.trim()).maybeSingle();if(ve)throw ve;let v=existing as Vessel|null;if(v&&v.shipping_line_id!==l.id){const{data:moved,error:me}=await supabase.from('vessels').update({shipping_line_id:l.id,imo_number:v.imo_number||input.imo}).eq('id',v.id).select('id,name,imo_number,shipping_line_id').single();if(me)throw me;v=moved as Vessel}if(!v)v=await createVessel(l.id,input.vesselName,input.imo);if(!v)return null;setVesselId(v.id);return{line:l,vessel:v}};\n const save=''',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          npm install
          npm run typecheck
          npm run build
          npm test
      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SettingsPage.tsx src/pages/ShipmentFirstPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: repair responsive app integrity and shipment directory state"
          git push

name: Customs OS Cloudflare Production Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-production-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customs-os-cloudflare-production-inventory
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only production account inventory
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect production Cloudflare resources without changing them
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Production Cloudflare credentials are not configured in the GitHub production environment."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4"
          work="$RUNNER_TEMP/customs-os-cloudflare-inventory"
          mkdir -p "$work"

          request() {
            local name="$1"
            local url="$2"
            local code
            code="$(curl --silent --show-error --max-time 25 \
              -o "$work/$name.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Accept: application/json" "$url")"
            printf '%s' "$code" > "$work/$name.status"
            if [ "$code" = "200" ]; then
              jq -e '.success == true' "$work/$name.json" >/dev/null
            fi
          }

          # Use a dedicated D1 token when configured; the Worker deploy token may not include D1 access.
          if [ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ]; then
            d1_token="$CLOUDFLARE_D1_API_TOKEN"
            d1_token_source="dedicated D1 token"
          else
            d1_token="$CLOUDFLARE_API_TOKEN"
            d1_token_source="Worker deployment token fallback"
          fi
          d1_code="$(curl --silent --show-error --max-time 25 -o "$work/d1.json" -w '%{http_code}' \\
            -H "Authorization: Bearer ${d1_token}" -H 'Accept: application/json' \\
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          printf '%s' "$d1_code" > "$work/d1.status"
          if [ "$d1_code" = "200" ]; then jq -e '.success == true' "$work/d1.json" >/dev/null; fi
          echo "D1 inventory auth source: $d1_token_source"
          request workers "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          request zone "$api/zones?name=darbandicommercial.ir"

          d1_status="$(cat "$work/d1.status")"
          workers_status="$(cat "$work/workers.status")"
          zone_status="$(cat "$work/zone.status")"

          {
            echo "## Cloudflare Production Inventory"
            echo
            echo "Read-only account inspection. No Worker, route, database, DNS, secret, or data was modified."
            echo
            echo "| Resource | HTTP |"
            echo "|---|---:|"
            echo "| D1 databases | $d1_status |"
            echo "| Workers scripts | $workers_status |"
            echo "| darbandicommercial.ir zone | $zone_status |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$d1_status" = "200" ]; then
            echo "### D1 databases" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.result[] | "- **" + .name + "** — (.uuid) — jurisdiction: (.jurisdiction // "unspecified")"' \
              "$work/d1.json" >> "$GITHUB_STEP_SUMMARY"
            prod_count="$(jq '[.result[] | select(.name == "customs-os-production")] | length' "$work/d1.json")"
            staging_count="$(jq '[.result[] | select(.name == "customs-os-migration-staging")] | length' "$work/d1.json")"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "- Production D1 database exists: **$([ "$prod_count" = "1" ] && echo yes || echo no)**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Previous migration database exists: **$([ "$staging_count" = "1" ] && echo yes || echo no)**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The production deployment token cannot read the D1 database inventory (HTTP $d1_status)."
            echo "Cloudflare response (sanitized):" >> "$GITHUB_STEP_SUMMARY"
            jq -c '{success, errors: [.errors[]? | {code, message}]}' "$work/d1.json" | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo "::error::Production Cloudflare credentials do not have D1 read permission. A D1 Edit-scoped token is required before provisioning production data."
            exit 1
          fi

          if [ "$workers_status" = "200" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### Existing Workers scripts" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.result[] | "- " + .id' "$work/workers.json" >> "$GITHUB_STEP_SUMMARY"
            if ! jq -e '[.result[].id] | index("customs") != null' "$work/workers.json" >/dev/null; then
              echo "::error::The production Worker named customs was not found in this account."
              exit 1
            fi
          else
            echo "::error::The production deployment token cannot read the Workers script inventory (HTTP $workers_status)."
            jq -c '{success, errors: [.errors[]? | {code, message}]}' "$work/workers.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

          if [ "$zone_status" = "200" ]; then
            jq -r '.result[] | "- Zone: **" + .name + "** — status: **" + .status + "**"' \
              "$work/zone.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The production deployment token cannot inspect the primary zone (HTTP $zone_status)."
            jq -c '{success, errors: [.errors[]? | {code, message}]}' "$work/zone.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

          echo
          echo "Production Cloudflare inventory completed. No resource or live traffic was changed."

name: Customs OS Cloudflare Production Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-production-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customs-os-cloudflare-production-inventory
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only production account inventory
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify the existing token and inspect production resources
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::The existing Cloudflare API token or account ID is missing from the production environment."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4"
          work="$RUNNER_TEMP/customs-os-cloudflare-inventory"
          mkdir -p "$work"

          request() {
            local name="$1"
            local url="$2"
            local code
            code="$(curl --silent --show-error --max-time 25 \
              -o "$work/$name.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Accept: application/json" "$url")"
            printf '%s' "$code" > "$work/$name.status"
            if [ "$code" = "200" ]; then
              jq -e '.success == true' "$work/$name.json" >/dev/null
            fi
          }

          # Verify that the exact existing GitHub production Secret is active.
          request token_verify "$api/user/tokens/verify"
          verify_status="$(cat "$work/token_verify.status")"
          if [ "$verify_status" != "200" ] || ! jq -e '.success == true and .result.status == "active"' "$work/token_verify.json" >/dev/null; then
            echo "::error::The existing CLOUDFLARE_API_TOKEN did not pass Cloudflare token verification."
            jq -c '{success, errors: [.errors[]? | {code, message}], result: {status: .result.status}}' "$work/token_verify.json" || true
            exit 1
          fi
          echo "Cloudflare API token verification: active"
          token_id="$(jq -r '.result.id // "unknown"' "$work/token_verify.json")"
          echo "Cloudflare API token ID: $token_id"
          {
            echo "### Token verification"
            echo "- Token ID: **$token_id**"
            echo "- Token policy details are not included in the verification response; the D1 endpoint response below is the permission check."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Use the same existing token for D1, Workers and DNS. This workflow is read-only.
          request d1 "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100"
          request workers "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          request zone "$api/zones?name=darbandicommercial.ir"

          d1_status="$(cat "$work/d1.status")"
          workers_status="$(cat "$work/workers.status")"
          zone_status="$(cat "$work/zone.status")"
          echo "Cloudflare account ID used for inventory: $CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare API HTTP statuses: D1=$d1_status Workers=$workers_status Zone=$zone_status"

          {
            echo "## Cloudflare Production Inventory"
            echo
            echo "Read-only inspection using the existing CLOUDFLARE_API_TOKEN Secret. No Worker, route, database, DNS, secret, or data was modified."
            echo
            echo "| Resource | HTTP |"
            echo "|---|---:|"
            echo "| Token verification | $verify_status (active) |"
            echo "| D1 databases | $d1_status |"
            echo "| Workers scripts | $workers_status |"
            echo "| darbandicommercial.ir zone | $zone_status |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$d1_status" = "200" ]; then
            echo "### D1 databases" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.result[] | "- **\(.name)** — \(.uuid) — jurisdiction: \(.jurisdiction // "unspecified")"' \
              "$work/d1.json" >> "$GITHUB_STEP_SUMMARY"
            echo "D1_DATABASE_INVENTORY_BEGIN"
            jq -r '.result[] | "D1_DATABASE name=\(.name) uuid=\(.uuid) jurisdiction=\(.jurisdiction // "unspecified")"' "$work/d1.json"
            echo "D1_DATABASE_INVENTORY_END"
            prod_count="$(jq '[.result[] | select(.name == "customs-os-production")] | length' "$work/d1.json")"
            migration_count="$(jq '[.result[] | select(.name == "customs-os-migration-staging")] | length' "$work/d1.json")"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "- Production D1 database exists: **$([ "$prod_count" = "1" ] && echo yes || echo no)**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Existing migration D1 database exists: **$([ "$migration_count" = "1" ] && echo yes || echo no)**" >> "$GITHUB_STEP_SUMMARY"
          else
            d1_error_code="$(jq -r '.errors[0].code // "unknown"' "$work/d1.json")"
            d1_error_message="$(jq -r '.errors[0].message // "No error message returned"' "$work/d1.json")"
            {
              echo "### D1 access diagnostic"
              echo
              echo "- Cloudflare error code: **$d1_error_code**"
              echo "- Cloudflare message: **$d1_error_message**"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$d1_error_code" = "10000" ]; then
              echo "::error::Cloudflare confirms the token is active, but it lacks the D1 permission required to list databases. Add D1 Read (or D1 Write) to this same API token."
            else
              echo "::error::Cloudflare rejected the D1 inventory request (HTTP $d1_status, code $d1_error_code)."
            fi
            exit 1
          fi

          if [ "$workers_status" = "200" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "### Existing Workers scripts" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.result[] | "- " + .id' "$work/workers.json" >> "$GITHUB_STEP_SUMMARY"
            echo "WORKER_INVENTORY_BEGIN"
            jq -r '.result[] | "WORKER_SCRIPT id=\(.id)"' "$work/workers.json"
            echo "WORKER_INVENTORY_END"
            if ! jq -e '[.result[].id] | index("customs") != null' "$work/workers.json" >/dev/null; then
              echo "::error::The production Worker named customs was not found in this account."
              exit 1
            fi
          else
            echo "::error::The existing API token cannot read the Workers script inventory (HTTP $workers_status)."
            jq -c '{success, errors: [.errors[]? | {code, message}]}' "$work/workers.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

          if [ "$zone_status" = "200" ]; then
            jq -r '.result[] | "- Zone: **" + .name + "** — status: **" + .status + "**"' \
              "$work/zone.json" >> "$GITHUB_STEP_SUMMARY"
            echo "ZONE_INVENTORY_BEGIN"
            jq -r '.result[] | "ZONE name=\(.name) status=\(.status) id=\(.id)"' "$work/zone.json"
            echo "ZONE_INVENTORY_END"
          else
            echo "::error::The existing API token cannot inspect the primary zone (HTTP $zone_status)."
            jq -c '{success, errors: [.errors[]? | {code, message}]}' "$work/zone.json" >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

          echo
          echo "Production Cloudflare inventory completed. No resource or live traffic was changed."

name: hybrid-p2p-zero-cost-validation

on:
  push:
    branches:
      - architecture/hybrid-p2p-offline
  pull_request:
    branches:
      - architecture/hybrid-p2p-offline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-p2p-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-staging:
    name: Ephemeral local Supabase + application checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      SUPABASE_TELEMETRY_DISABLED: "1"
      # No project ref, hosted database URL, or privileged cloud credentials are
      # configured in this job. All Supabase commands explicitly target --local.
    steps:
      - name: Checkout dedicated architecture branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm local-only environment
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "architecture/hybrid-p2p-offline" || test "${GITHUB_EVENT_NAME}" = "pull_request" || test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          if [[ -n "${SUPABASE_DB_URL:-}" || -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "Unexpected hosted Supabase credentials are configured in this job."
            exit 1
          fi
          supabase --version
          docker info >/dev/null

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend unit tests
        run: npm test

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Prepare disposable SQL replay set and suppress automatic migration replay
        shell: bash
        run: |
          set -euo pipefail
          # The original baseline is preserved under legacy-migrations because
          # production has already applied it. A clean local DB needs the base
          # migrations too. Build an ephemeral replay directory and temporarily
          # empty the CLI migration folder so 'supabase start' initializes only
          # Supabase's system schemas. Nothing here is committed back to Git.
          replay_dir="$RUNNER_TEMP/darbandi-migrations"
          active_dir="$RUNNER_TEMP/darbandi-active-migrations"
          mkdir -p "$replay_dir"
          cp supabase/migrations/*.sql "$replay_dir/"
          for migration in \
            00003_auth_foundation.sql \
            00004_reference_data.sql \
            00005_core_entities.sql \
            00006_finance_documents.sql \
            00007_audit_logs.sql \
            00008_indexes.sql \
            00009_rls.sql \
            00010_triggers.sql; do
            test -s "supabase/legacy-migrations/$migration"
            cp "supabase/legacy-migrations/$migration" "$replay_dir/$migration"
          done
          mv supabase/migrations "$active_dir"
          mkdir -p supabase/migrations

      - name: Start isolated local Supabase system services
        run: supabase start

      - name: Apply historical baseline and repository migrations to disposable LOCAL Postgres
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_customs-os' --format '{{.Names}}' | head -n 1)"
          if [[ -z "$db_container" ]]; then
            echo "Local Supabase Postgres container was not found."
            exit 1
          fi
          echo "Using disposable local database container: $db_container"
          while IFS= read -r migration; do
            echo "Applying $(basename "$migration") to ephemeral local Postgres"
            docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$migration"
          done < <(find "$RUNNER_TEMP/darbandi-migrations" -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Restore repository migration directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          active_dir="$RUNNER_TEMP/darbandi-active-migrations"
          if [[ -d "$active_dir" ]]; then
            rm -rf supabase/migrations
            mv "$active_dir" supabase/migrations
          fi

      - name: Run local database tests
        run: supabase test db --local

      - name: Capture local database status (no secrets)
        if: always()
        run: supabase status --output env | sed -E 's/(KEY|TOKEN|PASSWORD|SECRET)=.*/\1=[REDACTED]/' || true

      - name: Stop ephemeral local stack
        if: always()
        run: supabase stop --no-backup || true

name: Customs OS Cloudflare Free Staging

on:
  push:
    branches:
      - rebuild/cloudflare-free-first
    paths:
      - "src/**"
      - "public/**"
      - "worker/migration-staging.ts"
      - "wrangler.migration-staging.jsonc"
      - "supabase/migrations-cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-cloudflare-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customs-os-cloudflare-free-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://bjngfgiecvihofemptub.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_pIh0yF6SQcQ-IAa_FkbjWA_qTSm83Sr
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Deploy isolated Cloudflare staging Worker and static assets
        run: npx wrangler@4 deploy --config wrangler.migration-staging.jsonc

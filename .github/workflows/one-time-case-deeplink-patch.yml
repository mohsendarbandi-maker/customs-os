name: One-time case deep link patch
on:
  push:
    paths:
      - '.github/workflows/one-time-case-deeplink-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch OperationsPage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/OperationsPage.tsx')
          s=p.read_text()
          old=" const requestedTab=searchParams.get('tab');\n"
          new=" const requestedTab=searchParams.get('tab');\n const requestedCaseId=searchParams.get('caseId');\n"
          if old in s and 'requestedCaseId=searchParams.get(\'caseId\')' not in s:
              s=s.replace(old,new,1)
          old2=" useEffect(()=>{if(caseId)load()},[caseId]);\n\n const selectedClient"
          new2=" useEffect(()=>{if(requestedCaseId&&cases.some(c=>c.id===requestedCaseId)&&requestedCaseId!==caseId)selectCase(requestedCaseId)},[requestedCaseId,cases]);\n useEffect(()=>{if(caseId)load()},[caseId]);\n\n const selectedClient"
          if old2 in s and 'requestedCaseId&&cases.some' not in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          if git diff --quiet -- src/pages/OperationsPage.tsx; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OperationsPage.tsx
          git commit -m 'fix: open exact case from control center'
          git push

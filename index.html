<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <script>
      // Keep persisted auth sessions on one secure origin. Local development is exempt.
      (() => {
        const host = window.location.hostname.toLowerCase();
        const isPrimaryProductionHost =
          host === 'darbandicommercial.ir' ||
          host === 'www.darbandicommercial.ir';
        if (window.location.protocol !== 'http:' || !isPrimaryProductionHost) return;

        const secureUrl = new URL(window.location.href);
        secureUrl.protocol = 'https:';
        if (secureUrl.port === '80') secureUrl.port = '';
        window.location.replace(secureUrl.toString());
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Customs OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const path = window.location.pathname;
        const host = window.location.hostname.toLowerCase();
        const chatHost = host === 'chat.darbandicommercial.ir';
        const manifest = chatHost ? '/chat-subdomain.webmanifest?v=20261006-chat-subdomain-v2' : path.startsWith('/chat') ? '/chat-app-v4.webmanifest?v=20261005-chat-v4' : path.startsWith('/reminders') ? '/manifest-reminders.webmanifest' : '/manifest.webmanifest';
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', manifest);
      })();
    </script>
    <script>
      (() => {
        const key = 'customs-os-sw-reset-v3';
        if (!('serviceWorker' in navigator) || !('caches' in window)) return;
        try {
          if (sessionStorage.getItem(key) === '1') return;
        } catch {
          return;
        }
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          if (!registrations.length) return;
          try { sessionStorage.setItem(key, '1'); } catch {}
          return Promise.all(registrations.map((registration) => registration.unregister()))
            .then(() => caches.keys())
            .then((names) => Promise.all(names.map((name) => caches.delete(name))))
            .then(() => window.location.reload());
        }).catch(() => undefined);
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon-180.png?v=20261006-brand" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/pwa/apple-touch-icon-180.png?v=20261006-brand" />
    <title>Customs OS | سیستم مدیریت گمرک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { font-family:'Vazirmatn',sans-serif; background-color:#f8fafc; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

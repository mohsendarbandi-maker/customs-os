<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <script>
      // Canonical origin is HTTPS; normalize only the legacy HTTP request.
      (() => {
        const host = window.location.hostname.toLowerCase();
        const isPrimaryHost = host === 'darbandicommercial.ir' || host === 'www.darbandicommercial.ir';
        if (!isPrimaryHost || window.location.protocol !== 'http:') return;
        const target = new URL(window.location.href);
        target.protocol = 'https:';
        if (target.port === '80') target.port = '';
        window.location.replace(target.toString());
      })();
    </script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Customs OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Select the route-specific PWA manifest before the React app boots.
      // This keeps Chat and Reminders installs pointed at their own start URL.
      (() => {
        const path = window.location.pathname;
        const manifest =
          path.startsWith('/chat') ? '/manifest-chat.webmanifest' :
          path.startsWith('/reminders') ? '/manifest-reminders.webmanifest' :
          '/manifest.webmanifest';
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', manifest);
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon-180.png" />
    <title>Customs OS | سیستم مدیریت گمرک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { font-family:'Vazirmatn',sans-serif; background-color:#f8fafc; }
      #boot-loader { min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:#f8fafc; color:#0f172a; }
      #boot-loader-card { width:min(100%,360px); padding:24px; border:1px solid #e2e8f0; border-radius:20px; background:#fff; box-shadow:0 16px 50px rgba(15,23,42,.08); text-align:center; }
      #boot-loader-spinner { width:40px; height:40px; margin:0 auto 14px; border:4px solid rgba(15,76,129,.16); border-top-color:#0f4c81; border-radius:50%; animation:boot-spin .8s linear infinite; }
      #boot-loader-title { font-weight:800; font-size:14px; }
      #boot-loader-text { margin-top:7px; color:#64748b; font-size:12px; }
      @keyframes boot-spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"><div id="boot-loader" dir="rtl" role="status" aria-live="polite"><div id="boot-loader-card"><div id="boot-loader-spinner" aria-hidden="true"></div><div id="boot-loader-title">در حال بارگذاری سامانه…</div><div id="boot-loader-text">در حال آماده‌سازی Customs OS</div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

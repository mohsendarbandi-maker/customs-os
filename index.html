<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Customs OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const path = window.location.pathname;
        const manifest = path.startsWith('/chat') ? '/manifest-chat.webmanifest?app=chat-v3' : path.startsWith('/reminders') ? '/manifest-reminders.webmanifest' : '/manifest.webmanifest';
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.setAttribute('href', manifest);
      })();
    </script>
    <script>
      (() => {
        const key = 'customs-os-sw-reset-v2';
        if (!('serviceWorker' in navigator) || !('caches' in window)) return;
        try {
          if (sessionStorage.getItem(key) === '1') return;
        } catch {
          return;
        }
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          if (!registrations.length) return;
          try { sessionStorage.setItem(key, '1'); } catch {}
          return Promise.all(registrations.map((registration) => registration.unregister()))
            .then(() => caches.keys())
            .then((names) => Promise.all(names.map((name) => caches.delete(name))))
            .then(() => window.location.reload());
        }).catch(() => undefined);
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon-180.png" />
    <title>Customs OS | سیستم مدیریت گمرک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { font-family:'Vazirmatn',sans-serif; background-color:#f8fafc; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

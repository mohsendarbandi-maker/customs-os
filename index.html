<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Customs OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon-180.png" />
    <title>Customs OS | سیستم مدیریت گمرک</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" /></noscript>
    <style>
      html, body, #root { margin: 0; min-height: 100%; min-height: 100dvh; background: #0b1220; color: #e5edf8; }
      body { font-family: Vazirmatn, IRANSans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #boot-splash {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        text-align: center;
        box-sizing: border-box;
      }
      #boot-splash .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: linear-gradient(145deg, #2563eb, #06b6d4);
        box-shadow: 0 10px 30px rgba(37, 99, 235, .35);
      }
      #boot-splash p { margin: 0; color: #91a1b8; font-size: 14px; }
      #boot-error { display: none; margin-top: 18px; }
      #boot-error button {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div>
          <div class="mark" aria-hidden="true"></div>
          <p>در حال بارگذاری Customs OS…</p>
          <div id="boot-error">
            <p style="margin-bottom:12px">بارگذاری برنامه طول کشید. اتصال را بررسی کنید و دوباره تلاش کنید.</p>
            <button type="button" onclick="location.reload()">تلاش دوباره</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var err = document.getElementById('boot-error');
        if (err && document.getElementById('boot-splash')) err.style.display = 'block';
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
